interface:
  display_name: "风格模板分析与自生产"
  short_description: "从参考图或批准基线生产 OSS 最终化模板包与唯一真图封面"
  default_prompt: "使用 $style-template-analyzer 从参考图编译或从批准基线自生产 prompt-only 风格模板；自生产同时读取 GoodCase after-first 机制库和用户拒绝 BadCase 库，以 before/after 最终观感筛选 X/Y/B/C，自动沉淀明确不通过的 revision，再精确冻结通过项、分配唯一真实摄影测试图并完成 OSS 最终化。"
